name: Build Boards

on:
  # Manual runs exercise the full matrix, including CI-specific options.
  workflow_dispatch:
    inputs:
      variant_filter:
        description: 'Only build variants whose name/full_name contains this substring. Empty = changed-file selection.'
        required: false
        default: 'bread-compact-wifi-128x64'
  push:
    branches:
      - main
      - ci/* # for ci test
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v

      - id: select
        name: Select variants based on changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          VARIANT_FILTER: ${{ github.event.inputs.variant_filter }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CHANGED_FILE="$RUNNER_TEMP/changed-files.txt"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            git ls-files > "$CHANGED_FILE"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Checkout is the synthetic merge commit. Compare the PR branch
            # from its merge base, excluding unrelated updates on main.
            git diff --name-only --no-renames HEAD^1...HEAD^2 > "$CHANGED_FILE"
          elif [[ "$BEFORE_SHA" =~ ^0+$ && "$GITHUB_REF" != "refs/heads/main" ]] && \
               BASE_SHA=$(git merge-base HEAD origin/main); then
            # First push of a ci/* branch has an all-zero before SHA.
            git diff --name-only --no-renames "$BASE_SHA" HEAD > "$CHANGED_FILE"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && \
               git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames "$BEFORE_SHA" HEAD > "$CHANGED_FILE"
          else
            # A missing baseline (e.g. an unavailable force-pushed commit)
            # must not silently omit changed boards.
            git ls-files > "$CHANGED_FILE"
          fi

          cat "$CHANGED_FILE"

          # Keep the full manual matrix out of environment variables.
          python scripts/build.py --select-changed < "$CHANGED_FILE" > "$RUNNER_TEMP/variants.json"

          # Apply variant substring filter (push runs on ci/* default to 128x64).
          FILTER="$VARIANT_FILTER"
          if [[ -z "$FILTER" && "$EVENT_NAME" == "push" ]]; then
            FILTER="bread-compact-wifi-128x64"
          fi
          if [[ -n "$FILTER" ]]; then
            python - "$RUNNER_TEMP/variants.json" "$FILTER" <<'PY'
          import json, sys
          path, f = sys.argv[1], sys.argv[2]
          data = json.load(open(path, encoding="utf-8"))
          # Variants are dicts with name/full_name; tolerate plain path lists
          # (as used by the CI selection tests' mock selector) by skipping.
          if data and isinstance(data[0], dict):
              data = [v for v in data if f in v.get("name", "") or f in v.get("full_name", "")]
          json.dump(data, open(path, "w", encoding="utf-8"))
          print(f"Variant filter '{f}' applied, {len(data)} entries remain")
          PY
            # Fallback: the changed-file selection may not include the requested
            # variant (e.g. only workflow files changed). Rebuild the list from
            # the full variant catalog instead of skipping the build.
            if [[ "$(cat "$RUNNER_TEMP/variants.json")" == "[]" ]]; then
              echo "Filter matched nothing in changed-file selection; falling back to full catalog"
              python scripts/build.py --list-boards --json > "$RUNNER_TEMP/all_variants.json"
              python - "$RUNNER_TEMP/all_variants.json" "$RUNNER_TEMP/variants.json" "$FILTER" <<'PY'
          import json, sys
          src, dst, f = sys.argv[1], sys.argv[2], sys.argv[3]
          data = json.load(open(src, encoding="utf-8"))
          data = [v for v in data if f in v.get("name", "") or f in v.get("full_name", "")]
          json.dump(data, open(dst, "w", encoding="utf-8"))
          print(f"Fallback catalog filter '{f}': {[v['full_name'] for v in data]}")
          PY
            fi
          fi

          {
            printf 'variants='
            cat "$RUNNER_TEMP/variants.json"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.ci_name || matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build current variant
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          VARIANT: ${{ matrix.name }}
          BUILD_OPTIONS_JSON: ${{ toJSON(matrix.ci_build_options) }}
        run: |
          source "$IDF_PATH/export.sh"
          OPTIONS=()
          if [[ "$BUILD_OPTIONS_JSON" != "null" && -n "$BUILD_OPTIONS_JSON" ]]; then
            OPTIONS+=(--build-options-json "$BUILD_OPTIONS_JSON")
          fi
          python scripts/build.py "$BOARD" --name "$VARIANT" "${OPTIONS[@]}"

      # One-shot crash triage: symbolize the known LoadProhibited backtrace
      # captured on real hardware (addresses are stable for this source tree).
      - name: Symbolize known crash backtrace
        if: ${{ matrix.name == 'bread-compact-wifi-128x64' }}
        shell: bash
        run: |
          ELF=$(ls build/*.elf 2>/dev/null | head -1)
          echo "ELF: $ELF"
          xtensa-esp32s3-elf-addr2line -pfiaC -e "$ELF" \
            0x420ccfef 0x420cd161 0x420ccdb4 0x420cd3f8 0x4202725e \
            0x420272ad 0x4201461c 0x4202195b 0x421a21e2 0x4201ce43 \
            0x4201e376 0x4201e396 || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_${{ matrix.ci_name || matrix.full_name }}_${{ github.sha }}
          path: |
            build/merged-binary.bin
            build/*.elf
            sdkconfig
            build/xiaozhi-build.sdkconfig.defaults
          if-no-files-found: error

  release:
    name: Publish firmware release
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: xiaozhi_*
          path: dist

      - name: Rename binaries per variant
        run: |
          # One directory per artifact; avoid name collisions between variants
          for d in dist/xiaozhi_*/; do
            variant=$(basename "$d")
            if [ -f "$d/merged-binary.bin" ]; then
              cp "$d/merged-binary.bin" "dist/${variant}.bin"
            fi
          done
          ls -la dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ci-${{ github.run_id }}
        run: |
          gh release create "$TAG" dist/*.bin \
            --repo "$GITHUB_REPOSITORY" \
            --title "CI firmware $TAG" \
            --notes "Auto-built CI firmware (branch: ${{ github.ref_name }}, sha: ${{ github.sha }}). Flash the matching <variant>.bin at offset 0x0."
